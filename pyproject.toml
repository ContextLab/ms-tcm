[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ms_tcm"
version = "0.2.0.dev0"
description = "Multi-Stream Temporal Context Model (MS-TCM): v6 hierarchical-CMR implementation + FRFR-category worked example + MLE/CI fitter"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Contextual Dynamics Lab" },
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pyarrow>=14",
    "pandas>=2.1",
    "h5py>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "pytest-xdist>=3",
]
jax = [
    "jax>=0.4.28",
    "jaxlib>=0.4.28",
    "optax>=0.2.0",
]
figures = [
    "matplotlib>=3.8",
]

[project.scripts]
ms-tcm = "ms_tcm.cli:main"

[tool.setuptools.packages.find]
where = ["code"]
include = ["ms_tcm*"]

[tool.pytest.ini_options]
testpaths = ["code/tests"]
# Fast CI default excludes `slow` tests. To run the full suite (including the
# multi-minute parameter-recovery test) pass `-m "slow or not slow"`.
addopts = "--strict-markers -q -m 'not slow'"
markers = [
    "slow: marks tests that take more than a few seconds (bootstrap/parameter-recovery)",
]
